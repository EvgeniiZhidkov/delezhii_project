[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chores-e1"
version = "0.1.0"
description = "Paired goods/chores experiments with independently checked EF1 and SD fairness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.9"]

[tool.setuptools.packages.find]
include = ["chores_e1*"]
